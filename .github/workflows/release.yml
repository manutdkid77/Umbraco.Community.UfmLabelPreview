name: Release Package

# Runs when a version tag is pushed, for example `git tag 1.0.0 && git push origin 1.0.0`.
# Publishes with NuGet Trusted Publishing (OIDC), so no API key is stored in GitHub; it needs a policy on
# nuget.org for this repo and workflow file, and a NUGET_USER repository secret holding the nuget.org profile name.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

jobs:
  release:
    # Don't try to publish from forks
    if: github.repository == 'manutdkid77/Umbraco.Community.UfmLabelPreview'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # lets this job request a GitHub OIDC token to trade for a short-lived NuGet API key
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run JavaScript tests
        run: node --test

      # Stops a release whose tag disagrees with the version Umbraco loads from the manifest.
      - name: Check the tag matches umbraco-package.json
        run: |
          manifest=$(node -p "require('./src/Umbraco.Community.UfmLabelPreview/wwwroot/App_Plugins/UfmLabelPreview/umbraco-package.json').version")
          if [ "$manifest" != "${{ github.ref_name }}" ]; then
            echo "Tag ${{ github.ref_name }} does not match umbraco-package.json version $manifest"
            exit 1
          fi

      - name: Build and pack
        run: dotnet pack src/Umbraco.Community.UfmLabelPreview/Umbraco.Community.UfmLabelPreview.csproj -c Release -o artifacts /p:Version=${{ github.ref_name }}

      - name: NuGet login (OIDC to a temporary API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" -k ${{ steps.login.outputs.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate
